# Джерела моніторингу грантів для комунальних підприємств
# type: sedia | rss
# enabled: true/false — вмикайте/вимикайте без зміни коду
# weight: множник довіри до джерела (0.8–1.2), впливає на фінальний скоринг
# region: EU | UA | INT  (для фільтрів у дашборді)

sources:

  # ───────────────────────── ЄС: офіційний портал грантів і тендерів ──────────
  - id: eu_ft_portal
    name: "EU Funding & Tenders Portal (SEDIA)"
    type: sedia
    region: EU
    enabled: true
    weight: 1.2
    params:
      # type: 1 = гранти (topics), 2 = тендери/зовнішні дії, 8 = cascade funding
      types: ["1", "2", "8"]
      # 31094501 = Forthcoming, 31094502 = Open
      statuses: ["31094501", "31094502"]
      page_size: 100
      max_pages: 8
      # пошукові запити (кожен виконується окремо). *** = без текстового фільтра
      queries:
        # ── відходи та циркулярна економіка ──
        - "waste management"
        - "separate waste collection"
        - "recycling infrastructure"
        - "circular economy municipal"
        - "landfill remediation"
        - "biowaste composting"
        - "plastic packaging waste"
        - "construction and demolition waste"
        # ── благоустрій, вода, міське середовище ──
        - "green urban space"
        - "nature based solutions cities"
        - "water supply and sewerage"
        - "wastewater treatment municipality"
        - "climate adaptation cities"
        - "public lighting energy efficiency"
        # ── транспорт і техніка ──
        - "urban mobility public transport"
        - "clean buses electric fleet"
        - "waste collection equipment"
        - "procurement of vehicles municipalities"
        - "machinery and equipment municipalities"
        # ── громади, відновлення, Україна ──
        - "municipal infrastructure Ukraine"
        - "local authorities recovery"
        - "Ukraine reconstruction"
        - "Ukraine municipalities support"
        - "twinning cities cooperation"
        - "civil protection shelters"
        # ── освіта ──
        - "vocational education and training"
        - "school education infrastructure"
        - "skills development local"
        - "green skills training"
        - "digital education capacity"
        # ── інклюзивність і соціальна сфера ──
        - "accessibility persons with disabilities"
        - "inclusive public services"
        - "social inclusion local communities"
        - "assistive technologies accessibility"
        # ── вода, річки, довкілля ──
        - "river basin restoration"
        - "water resources management"
        - "nature restoration biodiversity"
        - "green infrastructure cities"
        # ── безпека, укриття, розмінування ──
        - "civil protection local level"
        - "humanitarian demining"
        - "disaster risk reduction municipalities"
        # ── здоров'я, культура, молодь, ветерани ──
        - "mental health community services"
        - "cultural heritage restoration"
        - "youth participation local"
        - "veterans reintegration support"
        # ── житло, цифровізація, туризм ──
        - "building renovation energy poverty"
        - "digital public services municipalities"
        - "sustainable tourism regions"
        # ── бізнес і енергетика ──
        - "SME circular economy support"
        - "energy efficiency buildings municipalities"
        - "renewable energy local communities"

  # ───────────────────────── ЄС: тендери (безкоштовний API, без ключа) ────────
  - id: ted
    name: "TED — тендери та закупівлі ЄС"
    type: ted
    region: EU
    enabled: true
    weight: 0.9
    beneficiary_hint: private      # підряди найчастіше для бізнесу
    params:
      limit: 40
      # синтаксис експерт-запитів TED; today(-30) = за останні 30 днів
      queries:
        - "notice-title ~ (waste) AND publication-date>=today(-30)"
        - "notice-title ~ (municipal) AND publication-date>=today(-30)"
        - "notice-title ~ (recycling) AND publication-date>=today(-30)"
        - "notice-title ~ (municipal waste collection)"
        - "notice-title ~ (refuse OR garbage)"
        - "place-of-performance-country-lot=UKR"
        - "buyer-country=UKR"
        # CPV: 34144510 сміттєвози, 44613700 контейнери для сміття,
        # 42914000 обладнання для переробки, 90500000 послуги з відходів
        - "classification-cpv IN (34144510 44613700) AND publication-date>=today(-60)"
        - "classification-cpv IN (42914000) AND publication-date>=today(-60)"

