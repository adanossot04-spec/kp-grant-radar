  # ─────────── Пошук по новинах: знаходить оголошення без власних RSS ─────────
  # Безкоштовно, без ключа. Кожен рядок queries — окремий пошук.
  # Оператори: "точна фраза", OR, -виключити, site:example.com, when:30d
  - id: gnews_ua
    name: "Пошук новин про гранти (укр.)"
    type: gnews
    region: UA
    enabled: true
    weight: 0.85
    params:
      lang: uk
      country: UA
      per_query: 20
      queries:
        - "грант громада відходи OR сміття when:120d"
        - "\"конкурс грантів\" комунальне підприємство when:120d"
        - "грант сміттєвоз OR контейнери OR спецтехніка громада when:180d"
        - "грант благоустрій парк OR сквер громада when:120d"
        - "грант водопостачання OR каналізація громада when:180d"
        - "грант енергоефективність громада when:120d"
        - "грант школа OR ліцей обладнання when:120d"
        - "грант освіта громада конкурс заявок when:120d"
        - "міжнародна технічна допомога громада конкурс when:120d"
        - "програма підтримки громад донор конкурс заявок when:120d"
        - "грантова програма приватне підприємство переробка when:180d"
        - "Закарпаття грант проєкт громада when:180d"
        # нові теми
        - "грант інклюзивність OR безбар'єрність громада when:180d"
        - "грант доступність для людей з інвалідністю заклад when:180d"
        - "грант відновлення річки OR водойми OR берегоукріплення when:180d"
        - "грант очисні споруди OR водоканал громада when:180d"
        - "грант укриття OR захисна споруда школа громада when:180d"
        - "грант розмінування OR генератор громада when:180d"
        - "грант молодіжний центр OR спортивний майданчик when:180d"
        - "грант бібліотека OR будинок культури проєкт when:180d"
        - "грант ветерани простір OR реінтеграція громада when:180d"
        - "грант ОСББ термомодернізація будинку when:180d"
        - "грант цифровізація OR електронні послуги громада when:180d"
        - "грант амбулаторія OR медичне обладнання громада when:180d"
        - "грант туризм OR велосипедний маршрут громада when:180d"

