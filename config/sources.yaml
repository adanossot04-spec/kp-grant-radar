  # ───────── Пошук у вебі без ключа (DuckDuckGo): «довгий хвіст» грантів ─────
  # УВАГА: DuckDuckGo блокує запити з деяких IP (хмарні сервери) — тоді джерело
  # просто віддає 0 записів. На домашньому комп'ютері чи іншому раннері працює,
  # тож вмикайте за потреби: enabled: true
  - id: websearch_ua
    name: "Пошук грантів у вебі (укр.)"
    type: websearch
    region: UA
    enabled: false
    weight: 0.95
    params:
      region: "ua-uk"
      per_query: 12
      queries:
        - "гранти для громад 2026 прийом заявок дедлайн"
        - "грант комунальному підприємству конкурс заявок"
        - "грант поводження з відходами громада прийом заявок"
        - "грант на сміттєвози контейнери спецтехніку для громади"
        - "грант водопостачання очисні споруди громада конкурс"
        - "грант інклюзивність безбар'єрність громада конкурс заявок"
        - "грант укриття школа громада конкурс заявок"
        - "грант енергоефективність ОСББ громада прийом заявок"
        - "грант благоустрій парк громадський простір конкурс"
        - "грант освіта школа обладнання прийом заявок 2026"
        - "грант молодіжний центр громада конкурс проєктів"
        - "грант ветеранський простір громада конкурс заявок"
        - "міжнародна технічна допомога громадам конкурс проєктів 2026"
        - "site:gurt.org.ua гранти громада відходи"
        - "site:prostir.ua конкурс грантів громада"
        - "site:chaszmin.com.ua гранти громада обладнання"

