# ─────────────── Пороги та налаштування ────────────────
scoring:
  scale: 0.92              # загальний масштаб балів (щоб не впиратись у стелю 100)
  high_threshold: 60      # 🔥 висока релевантність
  medium_threshold: 35    # 🟡 середня
  deadline_bonus_days: 45 # дедлайн ближче ніж N днів → +бонус за терміновість
  deadline_bonus: 8
  expired_penalty: -100   # прострочені дедлайни ховаємо
  llm_min_score: 30       # LLM-аналіз лише для записів з базовим балом >= цього
  llm_max_items: 25       # ліміт LLM-викликів за один запуск (економія токенів)
