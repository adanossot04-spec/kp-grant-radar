# Профіль організації — під нього рахується релевантність.
# Змінюйте ваги та слова під своє КП, код чіпати не треба.

organization:
  name: "Комунальне підприємство"
  country: "Україна"
  region: "Закарпатська область"
  sector: "Поводження з ТПВ, благоустрій, міський транспорт (а також моніторинг можливостей для приватних підприємств громади)"
  description: >
    Комунальне підприємство територіальної громади в Україні. Основні напрями:
    збирання, сортування, перевезення та захоронення твердих побутових відходів,
    рециклінг і циркулярна економіка, благоустрій і озеленення населених пунктів,
    утримання доріг і громадських просторів, комунальний автотранспорт і спецтехніка,
    енергоефективність власних об'єктів. Цікавлять гранти, технічна допомога,
    пільгові кредити та програми ЄС/МФО, доступні для муніципалітетів та
    комунальних підприємств України, у т.ч. транскордонні проєкти.
    Додатково відстежуються можливості для приватного бізнесу громади:
    МСП, переробка вторсировини, модернізація обладнання, енергоефективність
    виробництва, вихід на ринки ЄС.

