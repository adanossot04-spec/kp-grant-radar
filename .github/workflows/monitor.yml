name: Грант-радар — моніторинг

on:
  workflow_dispatch:          # кнопка «Run workflow» у вкладці Actions
  schedule:
    - cron: "0 5 * * *"       # щодня о 08:00 за Києвом (05:00 UTC)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grant-radar
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # ── безкоштовні LLM-ключі: досить будь-якого одного, без них теж працює ──
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      # ── сповіщення (необов'язково) ──
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # ── досьє організації (необов'язково, не комітиться) ──
      MEMORY_YAML: ${{ secrets.MEMORY_YAML }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Відновити досьє організації з секрету
        run: |
          if [ -n "$MEMORY_YAML" ]; then
            printf '%s' "$MEMORY_YAML" > config/memory.yaml
            echo "✅ config/memory.yaml відновлено із Secret"
          else
            echo "ℹ️  Secret MEMORY_YAML не задано — використовується шаблон memory.example.yaml"
          fi

      - name: Сканувати джерела та оцінити релевантність
        run: |
          python -m grant_radar collect
          python -m grant_radar top -n 10
            - name: Перерахувати бали за актуальним профілем
     run: python -m grant_radar rescore
     
      - name: Чернетки заявок для найкращих можливостей
        continue-on-error: true
        run: |
          python -m grant_radar draft --benef communal
          python -m grant_radar draft --benef private

      - name: Зібрати статичний дашборд
        run: python -m grant_radar export

      - name: Надіслати дайджест у Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: python -m grant_radar digest --min-score 45

      - name: Зберегти базу та сайт у репозиторій
        run: |
          git config user.name  "grant-radar-bot"
          git config user.email "actions@github.com"
          git add -A data docs
          git diff --staged --quiet || git commit -m "🛰️ Оновлення грант-радару $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
