# Довідник донорів: назва (як її пишуть в анонсах) → офіційна сторінка конкурсів.
#
# Використовується як останній фолбек модуля resolve.py: якщо в тексті анонсу
# взагалі немає зовнішнього посилання (каталог сховав його або продає послугу),
# агент визначає донора за згадкою в заголовку/описі й дає посилання на його
# сторінку грантів. Таке посилання маркується як «сторінка донора», щоб було
# видно: це не форма конкретної заявки, а розділ, де конкурс треба знайти.
#
# Як доповнити: додайте блок із ключами `url` і `match` (список шаблонів,
# регістр не важливий). Нічого перезапускати не треба — файл читається на льоту.

donors:
  - name: ПРООН (UNDP Україна)
    url: https://www.undp.org/uk/ukraine/calls-proposals
    match: [проон, "undp"]

  - name: ЮНІСЕФ (UNICEF Україна)
    url: https://www.unicef.org/ukraine/partnership-opportunities
    match: [юнісеф, "unicef"]

  - name: МОМ (IOM Україна)
    url: https://ukraine.iom.int/calls-proposals
    match: [мом україна, міжнародна організація з міграції, "iom ukraine", "iom "]

  - name: UN Women Україна
    url: https://ukraine.unwomen.org/en/partnerships/calls-for-proposals
    match: ["un women", "ООН Жінки"]

  - name: УВКБ ООН (UNHCR)
    url: https://www.unhcr.org/ua/partners
    match: ["unhcr", увкб оон]

  - name: ФАО (FAO Україна)
    url: https://www.fao.org/ukraine/ru/
    match: ["продовольча та сільськогосподарська організація", "fao ukraine"]

  - name: USAID
    url: https://www.grants.gov/search-grants
    match: ["usaid", юсейд]

  - name: GIZ
    url: https://www.giz.de/en/worldwide/302.html
    match: ["giz", німецьке товариство міжнародного співробітництва]

  - name: Європейська Комісія — портал Funding & Tenders
    url: https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-search
    match: [європейська комісія, єврокомісі, "horizon europe", "life programme", "cerv", "interreg", "european commission"]

  - name: EU4Business
    url: https://eu4business.org.ua/opportunities/
    match: ["eu4business", єс для бізнесу]

  - name: House of Europe
    url: https://houseofeurope.org.ua/opportunities
    match: ["house of europe", дім європи]

  - name: Erasmus+ Україна
    url: https://erasmusplus.org.ua/konkursy/
    match: ["erasmus", еразмус]

  - name: Креативна Європа
    url: https://creativeeurope.in.ua/opportunities
    match: [креативна європа, "creative europe", "culture moves europe"]

  - name: Вишеградський фонд
    url: https://www.visegradfund.org/apply/grants/
    match: [вишеградськ, "visegrad"]

  - name: Дія.Бізнес / єРобота
    url: https://business.diia.gov.ua/grants
    match: [дія.бізнес, "єробота", "e-robota", "дія бізнес"]

  - name: Український культурний фонд
    url: https://ucf.in.ua/programs
    match: [український культурний фонд, "укф", "ucf"]

  - name: Український ветеранський фонд
    url: https://veteranfund.com.ua/grants/
    match: [ветеранський фонд, "veteran fund"]

  - name: Фонд розвитку підприємництва (ФРП)
    url: https://bdf.gov.ua/uk/programs
    match: [фонд розвитку підприємництва, "бдф", "bdf.gov.ua", "5-7-9"]

  - name: Міжнародний фонд «Відродження»
    url: https://www.irf.ua/grantodavcha-diyalnist/
    match: [відродження, "irf.ua", "renaissance foundation"]

  - name: NEFCO
    url: https://www.nefco.int/financing/
    match: ["nefco", нефко]

  - name: ЄБРР (EBRD)
    url: https://www.ebrd.com/work-with-us/procurement.html
    match: ["ебрр", "єбрр", "ebrd"]

  - name: ЄІБ (EIB)
    url: https://www.eib.org/en/projects/pipelines/index.htm
    match: ["європейський інвестиційний банк", "єіб", "eib"]

  - name: Світовий банк
    url: https://projects.worldbank.org/en/projects-operations/projects-list?countrycode_exact=UA
    match: [світовий банк, "world bank"]

  - name: Банк розвитку Ради Європи (CEB)
    url: https://coebank.org/en/project-financing/
    match: ["coeb", банк розвитку ради європи]

  - name: E5P
    url: https://e5p.eu/projects/
    match: ["e5p"]

  - name: U-LEAD з Європою
    url: https://u-lead.org.ua/news
    match: ["u-lead", ю-лід]

  - name: People in Need (Людина в біді)
    url: https://ukraine.peopleinneed.net/uk/pidtrymka-biznesu
    match: ["people in need", людина в біді]

  - name: Caritas Ukraine
    url: https://caritas.ua/
    match: ["caritas", карітас]

  - name: Mercy Corps
    url: https://www.mercycorps.org/what-we-do/partner-with-us
    match: ["mercy corps", мерсі корпс]

  - name: Норвезька рада у справах біженців (NRC)
    url: https://www.nrc.no/countries/europe/ukraine
    match: ["норвезька рада у справах біженців", "norwegian refugee council"]

  - name: Британська Рада
    url: https://www.britishcouncil.org.ua/programmes
    match: [британська рада, "british council"]

  - name: Фонд Загорій
    url: https://zagoriy.foundation/programs/
    match: [загорій, "zagoriy"]

  - name: Чеська агенція розвитку (CzechAid)
    url: https://www.czechaid.cz/en/
    match: ["czechaid", чеська агенція розвитку]

  - name: Швейцарське бюро співробітництва (SDC)
    url: https://www.eda.admin.ch/countries/ukraine/en/home/representations/cooperation-office.html
    match: ["швейцарське бюро", "швейцарська агенція", "swiss cooperation"]

  - name: GIZ / Ukraine Facility
    url: https://www.ukrainefacility.me.gov.ua/
    match: ["ukraine facility", "юкрейн фесіліті", план україни]

  - name: Міністерство економіки України
    url: https://me.gov.ua/Tags/List?tag=Granti
    match: [мінекономіки, міністерство економіки]

  - name: Міністерство розвитку громад та територій
    url: https://mindev.gov.ua/
    match: [мінрозвитку, міністерство розвитку громад]
